name: Backend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: college_geeks_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/college_geeks_ci
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=backend/prisma/schema.prisma

      - name: Initialize PostgreSQL Roles
        run: |
          npx prisma db execute --stdin --schema=backend/prisma/schema.prisma << 'EOF'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon;
            END IF;
          END
          $$;
          GRANT authenticated, anon TO ci;
          EOF

      - name: Apply Prisma Migrations
        run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma

      - name: Grant Role Privileges for RLS
        run: |
          npx prisma db execute --stdin --schema=backend/prisma/schema.prisma << 'EOF'
          GRANT USAGE ON SCHEMA public TO authenticated, anon;
          GRANT ALL ON ALL TABLES IN SCHEMA public TO authenticated, anon;
          GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO authenticated, anon;
          GRANT ALL ON ALL ROUTINES IN SCHEMA public TO authenticated, anon;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO authenticated, anon;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO authenticated, anon;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON ROUTINES TO authenticated, anon;
          EOF

      - name: Seed Database
        run: npm run seed:game

      - name: Lint & Typecheck
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Test Suite
        run: npm test
